<title>AsynymBet Three Tier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* C · Three tiers on one screen: meeting tabs, then race tabs, then race-section tabs. No drill-down pages at all. */
:root{
  --ground:#F4F2EE; --sheet:#FFFFFF; --ink:#16201B; --muted:#5F6B66; --rule:#E4E1DA; --chip:#EFECE6;
  --brand:#136A4B; --brand-ink:#FFFFFF; --brand-wash:#E3F1EA;
  --good:#1B7F4E; --good-wash:#E2F3E8; --bad:#B8322A; --bad-wash:#FBE6E3; --warn:#9A6200; --warn-wash:#FCF0D6;
  --sb:#1E3687; --bf:#B57A00; --pb:#C4182F; --place:#2F5FD0;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0F1412;--sheet:#18201C;--ink:#EAF0EC;--muted:#9AA8A1;--rule:#2A3530;--chip:#222C27;--brand:#3FB683;--brand-ink:#08130E;--brand-wash:#183429;--good:#4CC98A;--good-wash:#173326;--bad:#F07A6E;--bad-wash:#3A1D1A;--warn:#F0B54A;--warn-wash:#3A2C12;--sb:#9CB0FF;--bf:#F2B53A;--pb:#FF7D8E;--place:#86A8FF;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0F1412;--sheet:#18201C;--ink:#EAF0EC;--muted:#9AA8A1;--rule:#2A3530;--chip:#222C27;--brand:#3FB683;--brand-ink:#08130E;--brand-wash:#183429;--good:#4CC98A;--good-wash:#173326;--bad:#F07A6E;--bad-wash:#3A1D1A;--warn:#F0B54A;--warn-wash:#3A2C12;--sb:#9CB0FF;--bf:#F2B53A;--pb:#FF7D8E;--place:#86A8FF;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.fill{flex:1;min-height:0;overflow:auto}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px;min-width:0}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cloth{flex:0 0 auto;width:24px;height:24px;border-radius:5px;background:#fff;color:#111;border:1.5px solid #111;display:inline-grid;place-items:center;font-weight:800;font-size:12px}
.cloth.lg{width:34px;height:34px;font-size:16px}
.brandbar{display:flex;align-items:center;gap:8px;padding-block:8px 6px}
.brandbar b{font-weight:800;color:var(--brand);font-size:16px}
.brandbar .pl{margin-left:auto;font-weight:800;color:var(--good)}
.wal{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.wal div{border-radius:9px;background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--c);padding:4px 7px;font-size:10.5px;color:var(--muted)}
.wal b{display:block;color:var(--ink);font-size:14px}
.plbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.plbar .tr{flex:1;height:6px;border-radius:3px;background:var(--rule);position:relative}
.plbar .tr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.plbar .fl{position:absolute;left:50%;top:0;bottom:0;width:18%;background:var(--good);border-radius:3px}
.plbar b{color:var(--good);font-size:13px}
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.strip button{flex:0 0 auto;border:1px solid var(--rule);background:var(--sheet);border-radius:9px;padding:3px 8px;font-size:11px;display:flex;flex-direction:column;align-items:flex-start;position:relative;min-width:44px;color:var(--muted)}
.strip button b{font-size:14px;color:var(--ink)}
.strip button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.strip button.on b{color:var(--brand-ink)}
.strip button i{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%}
.i-take{background:var(--good)}.i-res{background:var(--warn)}.i-none{background:var(--rule)}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:6px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button small{font-size:10px;background:var(--rule);border-radius:999px;padding:0 5px;margin-left:3px}
.clock{font-weight:800;color:var(--brand)}
.clock.now{color:var(--bad)}
.vlabel{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--good)}
.none .vlabel{color:var(--muted)}
.vrow{display:flex;align-items:center;gap:9px;margin-top:6px}
.vrow .nm{flex:1;min-width:0}
.vrow .nm b{display:block;font-size:17px;line-height:1.1}
.vrow .nm span{font-size:12px;color:var(--muted)}
.vrow .st{font-size:24px;font-weight:800}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.nums div{background:var(--chip);border-radius:8px;padding:4px 7px;font-size:10.5px;color:var(--muted)}
.nums b{display:block;color:var(--ink);font-size:14px}
.floor{margin-top:6px;font-size:12px;color:var(--good);font-weight:600}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.books button{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:9px;padding:5px 2px;font-size:11px;font-weight:700;line-height:1.1}
.books button b{display:block;font-size:15px}
.books button.best{background:var(--c);color:var(--sheet)}
.books button.ok{background:var(--good);border-color:var(--good);color:#fff}
.goto{display:flex;align-items:center;gap:9px;margin-top:8px;background:var(--brand-wash);border-radius:11px;padding:9px;text-decoration:none;color:var(--ink);border:0;width:100%;text-align:left}
.goto .rn{font-size:22px;font-weight:800;color:var(--brand)}
.goto small{display:block;color:var(--muted);font-size:12px}
.goto i{margin-left:auto;font-style:normal;font-size:20px;font-weight:800;color:var(--brand)}
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--rule)}
.r:first-child{border-top:0}
.r .t{flex:1;min-width:0}
.r .t small{display:block;color:var(--muted);font-size:11.5px}
.r .a{font-weight:800;white-space:nowrap}
.r .k{font-weight:700;width:62px;flex:0 0 auto}
.r.off{opacity:.5}
.bar2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:3px}
.bar2 i{display:block;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.bar2 i span{display:block;height:100%}
.pv{color:var(--good);font-weight:800}.ps{color:var(--muted);font-weight:700}
.tag{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:var(--chip)}
.say{border-left:3px solid var(--brand);background:var(--brand-wash);border-radius:0 9px 9px 0;padding:7px 9px;font-size:13px;margin:0}
.proto{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--muted);padding-top:6px;flex-wrap:wrap}
.proto button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:2px 9px;font-size:11px}
.proto button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

.app{padding-top:0}
.scr{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-block:8px 12px}
.back{border:0;background:none;color:var(--brand);font-weight:700;padding:0;text-align:left;font-size:13px}
.daychips{display:flex;gap:5px}
.daychips button{flex:1;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:5px 2px;font-weight:700;font-size:13px;line-height:1.15}
.daychips button small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.daychips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.daychips button.on small{color:var(--brand-ink);opacity:.85}
.mrow{display:flex;align-items:center;gap:9px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;width:100%;text-align:left}
.mrow .v{flex:1;min-width:0}
.mrow .v b{display:block;font-size:15px}
.mrow .v small{color:var(--muted);font-size:11.5px}
.mrow .n{font-weight:800;font-size:15px;text-align:center;line-height:1;background:var(--chip);border-radius:8px;padding:5px 7px}
.mrow .n small{display:block;font-size:9.5px;font-weight:600;color:var(--muted)}
.mrow .tk{font-size:11px;font-weight:800;color:var(--good);background:var(--good-wash);border-radius:6px;padding:2px 6px;white-space:nowrap}
.brow{display:flex;align-items:center;gap:9px;background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--good);border-radius:10px;padding:7px 9px;width:100%;text-align:left}
.brow.none{border-left-color:var(--rule)}
.brow .tm{font-weight:800;width:56px;flex:0 0 auto;font-size:13px}
.brow .tm small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
.brow .v{flex:1;min-width:0;font-size:13px}
.brow .v b{display:block;font-size:14px}
.brow .v small{color:var(--muted)}
.brow .a{font-weight:800}
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.rtabs button{flex:0 0 auto;border:0;background:none;padding:7px 9px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.rtabs button.on{color:var(--brand);border-color:var(--brand)}
.rtabs small{background:var(--chip);border-radius:999px;padding:0 5px;font-size:10px;margin-left:2px}
.mtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.mtabs button{flex:0 0 auto;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.mtabs button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.mtabs button i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:5px;vertical-align:middle}
.topnav{display:flex;gap:4px;background:var(--brand);color:var(--brand-ink);margin:0 calc(-1*max(10px,env(safe-area-inset-left,0px)));padding:8px max(10px,env(safe-area-inset-left,0px));align-items:center}
.topnav b{font-weight:800;font-size:16px;margin-right:auto}
.topnav button{border:0;background:none;color:inherit;font-weight:600;font-size:12.5px;padding:5px 8px;border-radius:999px;opacity:.85}
.topnav button.on{background:rgba(255,255,255,.2);opacity:1}
.dock{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);background:var(--sheet);margin:0 calc(-1*max(10px,env(safe-area-inset-left,0px)));padding-bottom:env(safe-area-inset-bottom,0px)}
.dock button{border:0;background:none;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.dock button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.dock button.on{color:var(--brand)}
.sec{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:2px 0 -2px;display:flex;justify-content:space-between}
.mhead{display:flex;flex-direction:column;gap:5px}
.mhead h2{margin:0;font-size:19px}
.facts{display:flex;flex-wrap:wrap;gap:4px}
.facts span{background:var(--chip);border-radius:999px;padding:2px 8px;font-size:11.5px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet .in{background:var(--ground);width:100%;max-width:460px;height:88%;border-radius:18px 18px 0 0;padding:10px max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet .bar{display:flex;align-items:center}
.sheet .bar button{margin-left:auto;border:0;background:var(--chip);border-radius:999px;padding:4px 12px;font-weight:700}

:root:root:root{--ground:#0A090E;--sheet:#15121C;--ink:#EEEAF8;--muted:#9D94B8;--rule:#2A2438;--chip:#1F1A2B;
 --brand:#A88BFF;--brand-ink:#120D1F;--brand-wash:#251C3D;--accent2:#6D4BD8;
 --good:#4ED19A;--good-wash:#14291F;--bad:#FF6F7D;--bad-wash:#33161C;--warn:#E9B65A;--warn-wash:#2E2414;
 --sb:#A88BFF;--bf:#A88BFF;--pb:#A88BFF;--place:#7C6CF0;color-scheme:dark}
body{background:radial-gradient(120% 60% at 50% -10%,#1E1236 0%,var(--ground) 55%) fixed,var(--ground)}
.cloth{background:#F4F1FF;color:#120D1F;border-color:#120D1F}
.hd{display:flex;flex-direction:column;gap:6px;padding-block:8px;margin:0 calc(-1*max(10px,env(safe-area-inset-left,0px)));padding-inline:max(10px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,#130F1D,#0E0B15);border-bottom:1px solid var(--rule)}
.hd .r1{display:flex;align-items:center;gap:8px}
.hd .logo{font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--ink)}
.hd .logo span{color:var(--brand)}
.hd .day{margin-left:auto;text-align:right;line-height:1}
.hd .day b{font-size:20px;font-weight:800}
.hd .day small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hd .up{color:var(--good)}.hd .down{color:var(--bad)}
.hd .tr{height:6px;border-radius:3px;background:var(--chip);position:relative}
.hd .tr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.hd .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.ags{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.ags .ag{flex:0 0 auto;display:flex;align-items:baseline;gap:5px;background:var(--chip);border:1px solid var(--rule);border-radius:9px;padding:4px 8px;font-size:11px;color:var(--muted)}
.ags .ag b{color:var(--ink);font-size:13px}
.ags .ag em{font-style:normal;font-size:10.5px}
.ags .set{flex:0 0 auto;border:1px dashed var(--brand);background:transparent;color:var(--brand);border-radius:9px;padding:4px 9px;font-size:11.5px;font-weight:700}
.agrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.agrow:first-child{border-top:0}
.agrow b{font-size:15px}
.agrow small{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.sw{width:46px;height:26px;border-radius:13px;background:var(--rule);border:0;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent2)}
.sw[aria-checked="true"]::after{left:23px;background:#fff}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
.bal{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.bal input{width:90px;background:var(--chip);border:1px solid var(--rule);border-radius:8px;color:var(--ink);padding:5px 8px;font:inherit}
.topnav{background:transparent;color:var(--ink);border-bottom:1px solid var(--rule)}
.topnav button.on{background:var(--brand-wash);color:var(--brand)}
.daychips button.on,.strip button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.daychips button.on small,.strip button.on b{color:#fff}
.mtabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.proto button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.books button.best{color:var(--brand-ink)}
.dock{background:#0E0B15}
#agSheet .in{height:auto;max-height:88%}

</style>
<div class="app">
<div class="proto">C · Three tiers on one screen · sample picks · <button data-v="take" type="button">Take</button><button data-v="none" type="button">Nothing here</button><button id="pNow" type="button">2 min</button></div>

<script>
const FIELD=[[20,"Point Of Law","B9 · E. Brown · C. Maher",14,30,7.0,8.5,"SB"],[12,"Hopewell Rock","B15 · Z. Lloyd · G. Boughey",13,30,8.0,7.8,"BF"],[2,"Trustyourinstinct","B18 · J. McDonald · A. O'Brien",10,25,10.0,9.4,"BF"],[16,"So You Are","B7 · R. King · B. Baker",9,25,11.0,13.0,"SB"],[24,"Shockletz","B17 · H. Coffey · C. Maher",9,25,11.0,11.0,"SB"],[11,"Juja Kibo","B14 · S. Clipperton · C. Maher",6,17,16.0,14.5,"BF"],[5,"Vauban","B3 · W. Pike · W. Mullins",5,15,20.0,17.0,"PB"],[8,"Wine Dark Sea","B11 · D. Lane · C. Waller",4,13,25.0,26.0,"SB"]];
const S={verdict:"take",now:false};
const $=s=>document.querySelector(s);
const UI={
 wallets:()=>`<div class="wal"><div style="--c:var(--sb)">Sportsbet<b>$90 <small style="color:var(--muted);font-weight:500">/150</small></b></div><div style="--c:var(--bf)">Betfair<b>$45 <small style="color:var(--muted);font-weight:500">/50</small></b></div><div style="--c:var(--pb)">PointsBet<b>$20 <small style="color:var(--muted);font-weight:500">/50</small></b></div></div>`,
 pnl:()=>`<div class="plbar"><span>Today</span><div class="tr"><div class="fl"></div></div><b>+$36</b></div>`,
 strip:(on=7)=>`<nav class="strip" aria-label="Races">${[[5,"1:40","res"],[6,"2:20","res"],[7,"3:00","take"],[8,"3:45","none"],[9,"4:25","take"],[10,"5:10","none"]].map(([n,t,s])=>`<button type="button" class="${n===on?"on":""}"><b>R${n}</b>${t}<i class="i-${s}"></i></button>`).join("")}</nav>`,
 clock:()=>S.now?`<span class="clock now">BET NOW · 2:00</span>`:`<span class="clock">12:40 to jump</span>`,
 head:()=>`<div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:22px;color:var(--brand);font-weight:800">R7</b><div style="min-width:0;flex:1"><b style="font-size:15px">Lexus Melbourne Cup</b><div style="font-size:11.5px;color:var(--muted)">3200m · 23 run · Good 4 · prices 40 s ago</div></div><span class="clk">${UI.clock()}</span></div>`,
 verdict:()=>S.verdict==="take"?`<div class="vlabel">Take this bet</div>
   <div class="vrow"><span class="cloth lg">20</span><div class="nm"><b>Point Of Law</b><span>Win · best at Sportsbet</span></div><span class="st">$10</span></div>
   <div class="nums"><div>Chance<b>1 in 7</b></div><div>Fair<b>$7.00</b></div><div>Best<b>$8.50</b></div></div>
   <div class="floor">Only worth it at $7.00 or better · PB Run 2nd applies</div>
   <div class="books"><button class="best" style="--c:var(--sb)" type="button">Sportsbet<b>$8.50</b></button><button style="--c:var(--bf)" type="button">Betfair<b>$8.20</b></button><button style="--c:var(--pb)" type="button">PointsBet<b>$8.00</b></button></div>`
  :`<div class="vlabel">Nothing worth trying here</div><p style="margin:5px 0 0;font-size:13px">Every runner is at or under its fair price. Best bet left today:</p>
   <button class="goto" type="button"><span class="rn">R9</span><span><b>4 Ferocious · Win $10</b><small>4:25pm · Betfair $6.50 · fair $5.20</small></span><i>›</i></button>`,
 say:()=>S.verdict==="take"?"We rate Point Of Law 1 in 7; Sportsbet pays $8.50, 21% over fair. Hopewell Rock is the likeliest placer. Exotics are short: skip.":"Every runner is at or under fair. Hold the money for R9.",
 bets:()=>`<div class="rows">
   <div class="r"><span class="k">Win</span><span class="t"><span class="cloth">20</span> Point Of Law<small>take $7.00+ · SB $8.50</small></span><span class="a">$10</span></div>
   <div class="r"><span class="k">Place</span><span class="t"><span class="cloth">12</span> Hopewell Rock<small>take $2.80+ · BF $3.10</small></span><span class="a">$5</span></div>

function bindAll(go){document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{R.day=b.dataset.day;R.meet=null;R.race=null;go()});
 document.querySelectorAll("[data-meet]").forEach(b=>b.onclick=()=>{R.meet=b.dataset.meet;R.race=b.dataset.race?+b.dataset.race:null;R.tab="bet";go()});
 document.querySelectorAll(".strip [data-race],.brow[data-race]:not([data-meet])").forEach(b=>b.onclick=()=>{R.race=+b.dataset.race;R.tab="bet";go()});
 document.querySelectorAll(".rtabs [data-tab]").forEach(b=>b.onclick=()=>{R.tab=b.dataset.tab;go()});
 document.querySelectorAll(".books button").forEach(b=>b.onclick=()=>{b.className="ok";b.innerHTML="✓ Placed<b>$10</b>"});}

function go(){if(!R.meet){const b=allBets()[0];R.meet=b?b.m.venue:meetings()[0].venue;R.race=b?b.r.n:1}
 if(!R.race)R.race=1;
 const ms=meetings();
 $("#tiers").innerHTML=V.days()+`<nav class="mtabs">${ms.map(m=>`<button data-meet="${m.venue}" class="${m.venue===R.meet?"on":""}" type="button">${m.venue}${races(m).some(r=>r.take&&!r.done)?"<i></i>":""}</button>`).join("")}</nav>`+V.strip();
 $("#scr").innerHTML=V.race();
 bindAll(()=>{if(!R.race)R.race=1;go()});}
wire(go);
</script>
