<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bottom sheets</title><style>

.hide{display:none!important}.mini{display:flex;gap:6px;flex-wrap:wrap}

.app{padding:8px 12px 120px}
.top{display:flex;align-items:center;gap:8px}.top h1{flex:1}
.leg .info{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);background:var(--chip);color:var(--muted);font-weight:800}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:436px;z-index:10;min-height:54px;border-radius:16px;background:var(--brand);color:var(--brand-ink);border:0;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 8px 24px #000a}
.layer{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;align-items:flex-end;touch-action:none}

.sheet{position:relative;width:100%;max-width:460px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-bottom:0;border-radius:20px 20px 0 0;transform:translateY(105%);will-change:transform;box-shadow:0 -10px 40px #0009;touch-action:none}
.layer.under .sheet{filter:brightness(.7)}
.sheet.anim{transition:transform .42s cubic-bezier(.2,1.15,.3,1)}.sheet.anim.out{transition:transform .26s cubic-bezier(.4,0,1,1)}
.sh-head{padding:8px 14px 4px;cursor:grab}.grab{width:44px;height:5px;border-radius:5px;background:#4a4160;margin:0 auto 8px}

.tabs{margin-top:4px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule)}
.mini{margin:6px 0 10px}
.card.btnrow{display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.sheet.anim,.sheet.anim.out,.bd{transition-duration:.01s!important}}
</style></head><body><div class="app"><h1>Melbourne Cup bets</h1><div class="tabs" id="tabs"><button class="on" data-t="build">Build</button><button data-t="bets">Challenges</button><button data-t="wallet">Wallet</button></div><div id="build"></div><div id="bets" class="hide"></div><div id="wallet" class="hide"></div></div><button class="bar hide" id="bar"></button><div id="toast" class="toast"></div><script>

function analyse(a){const games={},mk={},conf=[];a.forEach(l=>{(games[l.g]=games[l.g]||[]).push(l);if(mk[l.mk]&&mk[l.mk].side!==l.side)conf.push([mk[l.mk],l]);mk[l.mk]=mk[l.mk]||l});return{linked:Object.values(games).filter(x=>x.length>1),conf,sports:[...new Set(a.map(l=>l.s))]}}
/* ================= SHEET ENGINE ================= */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const stack=[];

function openSheet(title,html,bind){
  const layer=document.createElement('div');layer.className='layer';
  layer.innerHTML=`<div class="bd"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sh-head"><div class="grab"></div><div class="sh-title"><h2>${title}</h2><button class="btn sm" data-close aria-label="Close">✕</button></div></div><div class="sh-body">${html}</div></div>`;

const R={bk:'Sportsbet',stake:10,price:1,bonus:false,ch:0,bif:'',legs:[]};
function recHtml(){const s=R.stake,left=R.bonus?st.wallet-s:st.wallet,win=R.bonus?(R.price-1)*s:R.price*s,x=analyse(R.legs);
return `<div class="card"><div class="lbl">${R.legs.length>1?R.legs.length+'-leg multi · '+x.sports.join(' + '):'Single'} · price ${R.price.toFixed(2)}</div>${R.legs.map(l=>`<div class="row sm" style="padding:3px 0"><span class="sp ell"><span class="tag t-${l.s}">${l.s}</span>${l.t}</span><span>${l.p.toFixed(2)}</span></div>`).join('')}${x.linked.length?'<div class="link">Same game: linked</div>':''}${x.conf.length?'<div class="warn">Conflicting legs in this bet</div>':''}</div>
<div class="lbl">Bookmaker</div><div class="mini">${BOOKS.map(b=>`<button class="chip ${R.bk==b?'on':''}" data-bk="${b}">${b}</button>`).join('')}</div>
<div class="lbl">Stake</div><div class="mini">${[5,10,20,50].map(v=>`<button class="chip ${s==v?'on':''}" data-q="${v}">$${v}</button>`).join('')}${R.bonus?`<button class="chip" data-q="${st.wallet}">All ${$f(st.wallet)}</button>`:''}</div>
<div class="row"><div class="sp"><div class="lbl">Custom (cents ok)</div><input type="number" step="0.01" inputmode="decimal" id="stk" value="${s.toFixed(2)}"></div><div class="sp"><div class="lbl">Price got</div><input type="number" step="0.01" inputmode="decimal" id="prc" value="${R.price.toFixed(2)}"></div></div>
<div class="card" style="margin-top:10px"><div class="row"><span class="sp">Staked with a bonus bet</span><button class="tog ${R.bonus?'on':''}" id="tgl" aria-label="bonus"></button></div>${R.bonus?`<div class="bonus sm" style="margin-top:8px">Credit ${$f(st.wallet)} → <b>${$f(left)}</b> left after this bet</div>`:`<input type="number" step="0.01" id="bif" placeholder="Bonus bet if this wins (optional)" value="${R.bif}" style="margin-top:8px">`}</div>
<div class="lbl">Add to challenge</div><select id="chs" style="margin-top:4px">${CH.map((c,i)=>`<option value="${i}" ${R.ch==i?'selected':''}>${c}</option>`).join('')}</select>
<button class="btn pri" id="save" style="width:100%;margin-top:12px">Save bet · returns ${$f(win)}</button>`}
function openRec(legs){R.legs=legs;R.price=+comb(legs).toFixed(2);R.bonus=false;R.stake=10;
 openSheet('Record bet',recHtml(),S=>{const q=s=>S.body.querySelector(s);
  const rd=()=>{R.stake=+q('#stk').value||0;R.price=+q('#prc').value||1;if(q('#bif'))R.bif=q('#bif').value;R.ch=+q('#chs').value};
  const re=()=>{S.body.innerHTML=recHtml();bind2()};
  const bind2=()=>{S.body.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>{rd();R.bk=b.dataset.bk;re()});
   S.body.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{rd();R.stake=+b.dataset.q;re()});
   ['#stk','#prc','#bif','#chs'].forEach(i=>q(i)&&(q(i).onchange=()=>{rd();re()}));
   q('#tgl').onclick=()=>{rd();R.bonus=!R.bonus;if(R.bonus&&R.stake>st.wallet)R.stake=st.wallet;re()};
   q('#save').onclick=()=>{rd();const x=analyse(R.legs);if(R.bonus)st.wallet=Math.max(0,st.wallet-R.stake);st.bets.unshift({id:Date.now(),t:R.legs.length>1?R.legs.length+'-leg '+x.sports.join(' + ')+' multi':R.legs[0].t,legs:R.legs.length,bk:R.bk,stake:R.stake,price:R.price,bonus:R.bonus,bif:+R.bif||0,ch:R.ch?CH[R.ch].split(' · ')[0]:'',s:'o',det:R.legs.map(l=>l.s+' · '+l.t+' '+l.p.toFixed(2))});st.sel.clear();while(stack.length)stack[stack.length-1].close();renderBuild();renderBets();renderWallet();toast('Bet saved')}};
  bind2()})}
/* challenges */
const CHS=[{n:'Cup Run',stage:2,total:5,bank:48.20,target:3.30,pct:40},{n:'$10 to $1000',stage:1,total:8,bank:10.00,target:2.15,pct:12}];
const ret=b=>b.bonus?(b.price-1)*b.stake:b.price*b.stake;
function renderBets(){const root=$('#bets');
root.innerHTML=`<div class="row" style="margin:6px 2px"><span class="lbl sp">${CHS.length} challenges</span><button class="btn sm pri" id="nc">+ New</button></div>`+CHS.map((c,i)=>`<div class="card btnrow" data-c="${i}"><span class="sp"><b>${c.n}</b><div class="sm muted">stage ${c.stage}/${c.total} · bank ${$f(c.bank)} · next ${c.target.toFixed(2)}x</div><div style="height:5px;border-radius:5px;background:var(--rule);margin-top:6px"><div style="width:${c.pct}%;height:5px;border-radius:5px;background:var(--brand)"></div></div></span><span class="muted">›</span></div>`).join('');
$('#nc').onclick=()=>newChal();
root.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>chalSheet(CHS[+e.dataset.c]))}
function chalSheet(c){openSheet(c.n,'',S=>{const draw=()=>{const bs=st.bets.filter(b=>b.ch==c.n);S.body.innerHTML=`<div class="card"><div style="height:8px;border-radius:6px;background:var(--rule)"><div style="width:${c.pct}%;height:8px;border-radius:6px;background:var(--brand)"></div></div><div class="kv" style="margin-top:8px"><span class="muted">Stage</span><b>${c.stage} of ${c.total}</b></div><div class="kv"><span class="muted">Bank</span><b>${$f(c.bank)}</b></div><div class="kv" style="border:0"><span class="muted">Next target</span><b>${c.target.toFixed(2)}x</b></div></div><div class="lbl" style="margin:6px 2px">Bets in this challenge</div>${bs.length?`<div class="card" style="padding:4px 6px">`+bs.map(b=>{const k=b.s=='w'?'w':b.s=='l'?'l':'o';return `<div class="leg" data-b="${b.id}"><span class="sp"><b class="ell">${b.t}</b><small>${b.bk} · ${$f(b.stake)} @ ${b.price.toFixed(2)}</small></span><span class="pill ${k}">${b.s=='w'?'WON':b.s=='l'?'LOST':'OPEN'}</span></div>`}).join('')+`</div>`:'<div class="card muted sm">No bets yet.</div>'}`;
 S.body.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>betSheet(st.bets.find(x=>x.id==e.dataset.b),draw))};draw()})}
function betSheet(b,after){openSheet('Bet details','',S=>{const done=()=>{renderBets();renderWallet();after&&after()};const draw=()=>{S.body.innerHTML=`<div class="card"><div style="font-size:17px;font-weight:800">${b.t}</div><div class="sm muted">${b.bk} · ${b.bonus?'bonus ':''}${$f(b.stake)} @ ${b.price.toFixed(2)}</div>${b.det.map(d=>`<div class="sm muted" style="padding:3px 0">• ${d}</div>`).join('')}<div class="sm" style="margin-top:6px">${b.ch?'Challenge: '+b.ch+' · ':''}To return <b>${$f(ret(b))}</b>${b.bif?' · bonus if wins '+$f(b.bif):''}</div></div>
<div class="row">${b.s=='o'?`<button class="btn good sp" id="w">Won</button><button class="btn bad sp" id="l">Lost</button>`:`<button class="btn sp" id="u">Undo result</button>`}<button class="btn" id="e">Edit</button></div>`;
 const q=s=>S.body.querySelector(s);q('#w')&&(q('#w').onclick=()=>resultSheet(b,'w',S));q('#l')&&(q('#l').onclick=()=>resultSheet(b,'l',S));q('#u')&&(q('#u').onclick=()=>{b.s='o';done();draw()});q('#e').onclick=()=>editSheet(b,S)};S.redraw=()=>{done();draw()};draw()})}
function resultSheet(b,r,P){openSheet(r=='w'?'Mark as won?':'Mark as lost?',`<div class="card"><b>${b.t}</b><div class="sm muted">${r=='w'?'Returns '+$f(ret(b)):'Stake '+$f(b.stake)+' is lost'}</div></div><div class="row"><button class="btn sp" data-close2>Cancel</button><button class="btn ${r=='w'?'good':'bad'} sp" id="ok">Confirm ${r=='w'?'won':'lost'}</button></div>`,S=>{S.body.querySelector('[data-close2]').onclick=S.close;S.body.querySelector('#ok').onclick=()=>{b.s=r;S.close();P.redraw();toast(r=='w'?'Marked won':'Marked lost')}})}
function editSheet(b,P){openSheet('Edit bet',`<div class="lbl">Name</div><input type="text" id="en" value="${b.t.replace(/"/g,'')}"><div class="row" style="margin-top:8px"><div class="sp"><div class="lbl">Stake</div><input type="number" step="0.01" id="es" value="${b.stake.toFixed(2)}"></div><div class="sp"><div class="lbl">Price</div><input type="number" step="0.01" id="ep" value="${b.price.toFixed(2)}"></div></div><div class="mini" style="margin:10px 0">${BOOKS.map(k=>`<button class="chip ${b.bk==k?'on':''}" data-k="${k}">${k}</button>`).join('')}</div><div class="row"><button class="btn bad" id="del">Delete</button><button class="btn pri sp" id="ok">Save</button></div>`,S=>{let bk=b.bk;const q=s=>S.body.querySelector(s);
 S.body.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{bk=c.dataset.k;S.body.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x==c))});
 q('#ok').onclick=()=>{b.t=q('#en').value;b.stake=+q('#es').value;b.price=+q('#ep').value;b.bk=bk;S.close();P.redraw();toast('Saved')};
 q('#del').onclick=()=>{st.bets=st.bets.filter(x=>x!==b);S.close();P.close();renderBets()}})}
/* use in a challenge */
function chChoice(legs){const P=+comb(legs).toFixed(2);
 openSheet('Use in a challenge',`<div class="sm muted" style="margin-bottom:8px">${legs.length}-leg multi at ${P.toFixed(2)} · ${chance(legs).toFixed(1)}%</div><div class="lbl" style="margin:4px 2px">Challenge next leg</div>${CHS.map((c,i)=>`<div class="card btnrow" data-c="${i}"><span class="sp"><b>${c.n}</b><div class="sm muted">stage ${c.stage}/${c.total} · bank ${$f(c.bank)} · target ${c.target.toFixed(2)}x</div></span><span class="muted">›</span></div>`).join('')}<div class="lbl" style="margin:10px 2px 4px">Or</div><div class="card btnrow" id="nw" style="border-color:var(--brand)"><span class="sp"><b>New challenge</b><div class="sm muted">Plan stages from a start and a goal</div></span><span class="muted">›</span></div>`,S=>{
  S.body.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>fitSheet(CHS[+e.dataset.c],legs));
  S.body.querySelector('#nw').onclick=()=>newChal()})}
function fitSheet(c,legs){const P=+comb(legs).toFixed(2),ch=chance(legs),diff=P/c.target,pay=c.bank*P;
 openSheet(c.n+' · stage '+c.stage,`<div class="card multi"><div class="row"><div class="sp"><div class="lbl">Your multi</div><div style="font-size:26px;font-weight:800">${P.toFixed(2)}x</div></div><div class="sp" style="text-align:right"><div class="lbl">Stage target</div><div style="font-size:26px;font-weight:800">${c.target.toFixed(2)}x</div></div></div>
<div class="${diff>=0.95&&diff<=1.15?'link':diff<0.95?'warn':'link'}" style="margin-top:8px">${diff<0.95?'Short of the target by '+((1-diff)*100).toFixed(0)+'%':diff>1.15?'Above target: riskier than needed':'On target'}</div></div>
<div class="card"><div class="kv"><span class="muted">Chance</span><b>${ch.toFixed(1)}%</b></div><div class="kv"><span class="muted">Bank staked</span><b>${$f(c.bank)}</b></div><div class="kv" style="border:0"><span class="muted">Bank to payout</span><b>${$f(c.bank)} → ${$f(pay)}</b></div></div><button class="btn pri" id="pl" style="width:100%">Place</button>`,S=>{
  S.body.querySelector('#pl').onclick=()=>{st.bets.unshift({id:Date.now(),t:legs.length>1?legs.length+'-leg multi':legs[0].t,legs:legs.length,bk:'Sportsbet',stake:c.bank,price:P,bonus:false,ch:c.n,s:'o',det:legs.map(l=>l.s+' · '+l.t+' '+l.p.toFixed(2))});st.sel.clear();while(stack.length)stack[stack.length-1].close();renderBuild();renderBets();toast('Placed in '+c.n)}})}
/* new challenge */
const NC={start:10,goal:1000,mode:'leg',per:2,k:null};
function bestPick(m,mode,per){let best=null;const g=(i,cur)=>{if(cur.length==per){const p=comb(cur),d=Math.abs(Math.log(p/m));if(!best||d<best.d)best={d,legs:[...cur],p};return}
 for(let j=i;j<LEGS.length;j++){const l=LEGS[j];if(l.custom)continue;if(cur.some(x=>mode=='game'?x.g!=l.g:x.g==l.g))continue;if(cur.some(x=>x.mk==l.mk))continue;g(j+1,[...cur,l])}};g(0,[]);return best}
function ncOpts(){const R=NC.goal/NC.start,edge=Math.pow(0.95,NC.per);return [2,3,4,5,6,7,8].map(k=>{const m=Math.pow(R,1/k),pc=Math.min(0.97,edge/m);return{k,m,pc,fin:Math.pow(pc,k)}})}
function ncHtml(){const o=ncOpts(),bestK=o.reduce((a,b)=>b.fin>a.fin?b:a).k;if(!NC.k)NC.k=bestK;const mx=Math.max(...o.map(x=>x.fin)),sel=o.find(x=>x.k==NC.k),pick=bestPick(sel.m,NC.mode,NC.per);
return `<div class="row"><div class="sp"><div class="lbl">Start $</div><input type="number" step="0.01" inputmode="decimal" id="ns" value="${NC.start.toFixed(2)}"></div><div class="sp"><div class="lbl">Goal $</div><input type="number" step="0.01" inputmode="decimal" id="ng" value="${NC.goal.toFixed(2)}"></div></div>
<div class="tabs" style="margin:10px 0 6px"><button class="${NC.mode=='game'?'on':''}" data-m="game">One game</button><button class="${NC.mode=='leg'?'on':''}" data-m="leg">One leg per game</button></div>
<div class="lbl">Legs per multi</div><div class="mini">${[1,2,3,4].map(n=>`<button class="chip ${NC.per==n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
<div class="lbl">Chance to finish by stages</div><div style="margin-top:6px">${o.map(x=>`<div class="card btnrow" data-k="${x.k}" style="min-height:64px;margin-bottom:6px;${NC.k==x.k?'border-color:var(--brand);background:var(--brand-wash)':''}"><span class="sp"><b>${x.k} stages${x.k==bestK?' <span class="pill w">BEST</span>':''}</b><div class="sm muted">${x.m.toFixed(1)}x each · ${(x.pc*100).toFixed(0)}% a stage · <b style="color:var(--ink)">${(x.fin*100).toFixed(1)}%</b> to finish</div><div style="height:5px;border-radius:5px;background:var(--rule);margin-top:6px"><div style="width:${Math.max(4,x.fin/mx*100)}%;height:5px;border-radius:5px;background:${NC.k==x.k?'var(--brand)':'#5b4f7a'}"></div></div></span></div>`).join('')}</div>
<div class="card multi"><div class="lbl">Best stage 1 pick</div>${pick?`<div style="font-size:22px;font-weight:800">${pick.p.toFixed(2)}x <small class="muted" style="font-size:12px;font-weight:600">${chance(pick.legs).toFixed(1)}% chance</small></div>`+pick.legs.map(l=>`<div class="sm" style="padding:3px 0"><span class="tag t-${l.s}">${l.s}</span>${l.t} <span class="muted">${l.p.toFixed(2)}</span></div>`).join(''):'<div class="sm muted">No matching legs for this setup. Try another mode or fewer legs.</div>'}</div>
<button class="btn pri" id="go" style="width:100%" ${pick?'':'disabled'}>Start challenge</button>`}
function newChal(){NC.k=null;openSheet('New challenge',ncHtml(),S=>{const q=s=>S.body.querySelector(s);
 const re=()=>{const y=S.body.scrollTop;S.body.innerHTML=ncHtml();hook();S.body.scrollTop=y};
 const rd=()=>{NC.start=Math.max(0.01,+q('#ns').value||10);NC.goal=Math.max(NC.start*1.5,+q('#ng').value||1000)};
 const hook=()=>{['#ns','#ng'].forEach(i=>q(i).onchange=()=>{rd();NC.k=null;re()});
  S.body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{rd();NC.mode=b.dataset.m;re()});
  S.body.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{rd();NC.per=+b.dataset.n;NC.k=null;re()});
  S.body.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{rd();NC.k=+b.dataset.k;re()});
  q('#go').onclick=()=>{rd();const m=Math.pow(NC.goal/NC.start,1/NC.k);CHS.unshift({n:'$'+NC.start.toFixed(0)+' to $'+NC.goal.toFixed(0),stage:1,total:NC.k,bank:NC.start,target:+m.toFixed(2),pct:0});while(stack.length)stack[stack.length-1].close();renderBets();toast('Challenge started')}};hook()})}
/* wallet */
function renderWallet(){const root=$('#wallet'),open=st.bets.filter(b=>b.s=='o').reduce((n,b)=>n+b.stake,0);
root.innerHTML=`<div class="bonus"><div class="row"><span class="sp"><span class="lbl" style="color:var(--warn)">Bonus credits</span><div style="font-size:24px;font-weight:800">${$f(st.wallet)} <small style="font-size:12px;font-weight:600">Sportsbet</small></div></span><button class="btn sm" id="addb">+ Credit</button></div></div>
<div style="height:8px"></div><div class="card sm muted">At risk in open bets: <b style="color:var(--ink)">${$f(open)}</b></div>`;
$('#addb').onclick=()=>openSheet('Add credit',`<div class="lbl">Amount</div><input type="number" step="0.01" inputmode="decimal" id="bamt" placeholder="0.00"><div class="mini" style="margin-top:10px">${[5,10,20,50].map(v=>`<button class="chip" data-a="${v}">$${v}</button>`).join('')}</div><button class="btn pri" id="bok" style="width:100%">Add credit</button>`,S=>{const q=s=>S.body.querySelector(s);S.body.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>q('#bamt').value=c.dataset.a);q('#bok').onclick=()=>{st.wallet+=+q('#bamt').value||0;renderWallet();S.close();toast('Credit added')}})}
$$('#tabs button').forEach(b=>b.onclick=()=>{$$('#tabs button').forEach(x=>x.classList.toggle('on',x==b));['build','bets','wallet'].forEach(t=>$('#'+t).classList.toggle('hide',t!=b.dataset.t));$('#bar').style.display=b.dataset.t=='build'?'':'none'});
renderBuild();renderBets();renderWallet();
</script></body></html>
