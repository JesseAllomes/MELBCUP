# Render Blueprint: one free web service. Secrets are entered in the Render dashboard
# (sync: false), never committed.
services:
  - type: web
    name: melbcup
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install .
    startCommand: uvicorn melbcup.web.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PUNTERSEDGE_API_KEY
        sync: false
      - key: FORMFAV_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: POLL_SECONDS
        value: "60"
