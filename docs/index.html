<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15191b">
  <meta name="robots" content="noindex">
  <title>MELBCUP</title>
  <link rel="stylesheet" href="app.css">
  <style>
    .shell { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
    .boot { margin-top: 18vh; }
    .boot strong { display: block; font-size: 20px; letter-spacing: 0.14em; color: var(--accent); margin-bottom: 8px; }
    .boot p { color: var(--muted); }
    .keys label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    .keys input { width: 100%; }
    .keys button { margin-top: 14px; }
    .keys p { color: var(--muted); font-size: 13px; }
    .busy { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--cloth); color: var(--cloth-ink); font-size: 13px; z-index: 20; }
    .error { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 30; }
  </style>
</head>
<body>
  <div id="boot" class="shell boot">
    <strong>MELBCUP</strong>
    <p id="boot-text">Starting…</p>
    <p class="small">The first open downloads the model (about 10 MB). After that it starts quickly.</p>
  </div>

  <div id="app" hidden></div>

  <div id="keys" class="shell" hidden>
    <form id="keys-form" class="keys">
      <h1>API keys</h1>
      <p>MELBCUP runs on this phone and calls PuntersEdge and FormFav directly. Your keys are saved on
        this phone only; they are never sent anywhere else.</p>
      <label for="pe-key">PuntersEdge key (required)</label>
      <input id="pe-key" autocomplete="off" spellcheck="false" inputmode="text">
      <label for="ff-key">FormFav key (optional, adds long-form history and ratings)</label>
      <input id="ff-key" autocomplete="off" spellcheck="false" inputmode="text">
      <button type="submit">Save and start</button>
      <p id="keys-note"></p>
    </form>
  </div>

  <div id="busy" class="busy" hidden><span id="busy-text">Working…</span></div>
  <p id="error" class="alert error" hidden></p>

  <script src="main.js"></script>
</body>
</html>
