{# One graded pick. Needs: g (Graded) #}
<div class="graded {{ 'hit' if g.hit else 'miss' }}">
  <span class="mark">{{ '✓' if g.hit else '✗' }}</span>
  <span class="what"><strong>{{ g.label }}</strong> {{ g.selection }}{% if g.value %} <span class="badge good">VALUE</span>{% endif %}</span>
  <span class="ret">{% if g.returned is none %}{{ 'dividend n/a' if g.hit else '' }}{% elif g.hit %}{{ g.returned | money }} back{% else %}–$1{% endif %}</span>
</div>
