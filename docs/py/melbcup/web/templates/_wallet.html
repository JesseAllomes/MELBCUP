{# Money left today in each account: the day amount less the bets ticked as placed. Needs: wallet #}
<section class="wallet" aria-label="Money left today">
  {% for code, name, amount, used in wallet.accounts() %}
  {% set left = [amount - used, 0] | max %}
  <div class="acct" data-acct="{{ code }}">
    <div class="acct-top"><b>{{ name }}</b><span><b class="left">{{ left | dollars }}</b> left of {{ amount | dollars }}</span></div>
    <div class="bar {{ code }}" role="meter" aria-label="{{ name }} spent" aria-valuemin="0" aria-valuemax="{{ amount | round | int }}" aria-valuenow="{{ used }}"><i style="width:{{ ([100 * used / amount, 100] | min) | round(1) if amount else (100 if used else 0) }}%"></i></div>
  </div>
  {% endfor %}
</section>
