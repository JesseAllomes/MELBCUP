[project]
name = "melbcup"
version = "0.1.0"
description = "Melbourne Cup day form analysis and value pick generator"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["melbcup*"]

[tool.setuptools.package-data]
"melbcup.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
