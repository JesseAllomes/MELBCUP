# Read-only snapshots of Damian's RaceLens app on Oaks Day (owner and Damian agreed, 2026-11-03), so its
# pre-jump predictions and results are kept for the model head-to-head even if meetings are deleted later.
# Every 5 minutes, 8:00am to 8:55pm Melbourne (AEDT, UTC+11) on Thu 5 Nov. Token-free.
# Needs repository secrets RACELENS_URL and RACELENS_PASSWORD. Data goes to the `racelens-data` branch.
name: racelens-snapshot
on:
  schedule:
    - cron: "*/5 21-23 4 11 *"
    - cron: "*/5 0-9 5 11 *"
  workflow_dispatch:
    inputs:
      date:
        description: "Race day to snapshot (YYYY-MM-DD, Melbourne)"
        default: "2026-11-05"
concurrency:
  group: racelens-snapshot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only on the chosen race day
        id: day
        run: |
          want="${{ github.event.inputs.date || '2026-11-05' }}"
          today=$(TZ=Australia/Melbourne date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$today" != "$want" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
          echo "date=$want" >> "$GITHUB_OUTPUT"
      - name: Snapshot code (main)
        if: steps.day.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: code
      - name: Data branch
        if: steps.day.outputs.run == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" racelens-data >/dev/null; then
            git clone --quiet --depth 1 --branch racelens-data "$remote" store
          else
            mkdir store && cd store && git init --quiet -b racelens-data && git remote add origin "$remote"
          fi
      - name: Snapshot
        if: steps.day.outputs.run == 'true'
        working-directory: store
        env:
          RACELENS_URL: ${{ secrets.RACELENS_URL }}
          RACELENS_PASSWORD: ${{ secrets.RACELENS_PASSWORD }}
        run: |
          python3 ../code/tools/racelens/snapshot.py --date "${{ steps.day.outputs.date }}" --out racelens
          git config user.name "racelens-snapshot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A racelens
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit --quiet -m "RaceLens snapshot $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git push --quiet origin racelens-data && break; sleep $((i*5)); git pull --quiet --rebase origin racelens-data || true; done
